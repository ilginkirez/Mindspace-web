services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindspace-backend
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=file:/app/data/prod.db
      - JWT_SECRET=${JWT_SECRET:-super-secret-change-me}
    volumes:
      # SQLite veritabanını kalıcı tut
      - sqlite_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindspace-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
